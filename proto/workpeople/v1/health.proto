syntax = "proto3";

package workpeople.v1;

// Canonical contract. Sync the client copy with `npm run contracts:sync`.
service HealthService {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}

message HealthCheckRequest {}

message HealthCheckResponse {
  string status = 1;
  string service = 2;
  string version = 3;
  string checked_at = 4;
  map<string, string> dependencies = 5;
}
