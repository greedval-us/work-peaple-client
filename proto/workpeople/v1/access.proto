syntax = "proto3";
package workpeople.v1;
import "identity.proto";

// Administrative operations; no public registration endpoint exists.
service AccessService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc CreateUser(CreateUserRequest) returns (User);
  rpc UpdateUser(UpdateUserRequest) returns (User);
  rpc SetUserRoles(SetUserRolesRequest) returns (User);
  rpc ListRoles(Empty) returns (ListRolesResponse);
  rpc CreateRole(CreateRoleRequest) returns (Role);
  rpc UpdateRole(UpdateRoleRequest) returns (Role);
  rpc DeleteRole(IdRequest) returns (Empty);
  rpc SetRolePermissions(SetRolePermissionsRequest) returns (Role);
  rpc ListPermissions(Empty) returns (ListPermissionsResponse);
}

message IdRequest { string id = 1; }
message ListUsersRequest { int32 limit = 1; int32 offset = 2; string search = 3; }
message ListUsersResponse { repeated User users = 1; int32 total = 2; }
message CreateUserRequest {
  string login = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
  string middle_name = 5;
  string email = 6;
  string phone = 7;
  repeated string role_ids = 8;
}
message UpdateUserRequest {
  string id = 1;
  optional string login = 2;
  optional string first_name = 3;
  optional string last_name = 4;
  optional string middle_name = 5;
  optional string email = 6;
  optional string phone = 7;
  optional bool is_active = 8;
  optional string password = 9;
}
message SetUserRolesRequest { string user_id = 1; repeated string role_ids = 2; }
message ListRolesResponse { repeated Role roles = 1; }
message CreateRoleRequest {
  string code = 1;
  string name = 2;
  string description = 3;
  repeated string permission_codes = 4;
}
message UpdateRoleRequest { string id = 1; string name = 2; string description = 3; }
message SetRolePermissionsRequest { string role_id = 1; repeated string permission_codes = 2; }
message ListPermissionsResponse { repeated Permission permissions = 1; }
