appId: ru.workpeople.desktop
productName: Work People
directories:
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: proto
    to: proto
    filter:
      - '**/*.proto'
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: '${productName}-${version}-${arch}-setup.${ext}'
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
portable:
  artifactName: '${productName}-${version}-${arch}-portable.${ext}'
